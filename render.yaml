# Render Blueprint: https://render.com/docs/blueprint-spec
# Two services from this repo: the Express API (free web service) and the React client (static site).
# Secrets are NOT in this file. Values marked `sync: false` are entered in the Render dashboard
# when the Blueprint is first applied, and live only there (CLAUDE.md hard rule 2).
#
# The URLs below assume Render grants the names `bughunter-arena-api` and `bughunter-arena`.
# If a name is taken, Render adds a suffix: update ALLOWED_ORIGIN, VITE_API_URL and the CSP
# connect-src to the real URLs, then redeploy both services.

services:
  - type: web
    name: bughunter-arena-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Outside /api and not rate limited (server/src/app.js).
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: ALLOWED_ORIGIN
        value: https://bughunter-arena.onrender.com
      # Render's load balancer is one proxy hop in front of the app.
      - key: TRUST_PROXY
        value: '1'
      - key: DEMO_MODE
        value: 'false'
      - key: AI_TIMEOUT_MS
        value: '15000'
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Public-grade, but only the server uses it (login and refresh).
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

  - type: web
    name: bughunter-arena
    runtime: static
    rootDir: client
    # prebuild copies Pyodide from node_modules into public/pyodide (no CDN at runtime).
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Public, inlined into the bundle at build time. Never put a secret in a VITE_ variable.
      - key: VITE_API_URL
        value: https://bughunter-arena-api.onrender.com
      - key: VITE_USE_MOCKS
        value: 'false'
    routes:
      # Client-side routing (react-router): every unknown path serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Report-Only first: violations show in the browser console without breaking the app.
      # After checking a full solve on the live site, rename the header to
      # Content-Security-Policy to enforce it.
      # 'wasm-unsafe-eval' is for Pyodide; style-src 'unsafe-inline' is for Monaco.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://bughunter-arena-api.onrender.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Pyodide (~10 MB) is copied from the pinned npm package without hashed names, so it is
      # cached for a day instead of forever. A Pyodide upgrade reaches everyone within 24 h.
      - path: /pyodide/*
        name: Cache-Control
        value: public, max-age=86400
