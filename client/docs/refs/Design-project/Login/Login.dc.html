<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BugHunter Arena – Log in</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F14}
a{color:#C9D4E3;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="background: #0B0F14; color: #E6EDF6; font-family: Inter, system-ui, sans-serif; min-height: 100vh; display: flex; flex-wrap: wrap">

  <!-- Left: brand panel -->
  <div style="flex: 1 1 520px; min-width: 0; background-color: #0D1218; background-image: radial-gradient(#1A2330 1px, transparent 1px); background-size: 28px 28px; border-right: 1px solid #1C2532; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
    <a href="Artboard-9it2.dc.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.9 1.9"></path><path d="M16 2l-1.9 1.9"></path><path d="M9 7.1V6a3 3 0 0 1 6 0v1.1"></path><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"></path><path d="M12 20v-9"></path><path d="M6.5 13H3"></path><path d="M21 13h-3.5"></path><path d="M6 9.5L3.5 8"></path><path d="M18 9.5L20.5 8"></path><path d="M6.5 17.5L4 19"></path><path d="M17.5 17.5L20 19"></path></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px">BugHunter<span style="color: {{accent}}"> Arena</span></span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 24px; max-width: 480px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.05; letter-spacing: -0.03em; color: #FFFFFF">Welcome back,<br><span style="color: {{accent}}">hunter.</span></h2>
      <div style="border: 1px solid #243042; border-radius: 12px; background: #0F141C; padding: 16px 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.9">
        <div style="padding: 0 18px; color: #6F7F95">$ bughunter status</div>
        <div style="padding: 0 18px; color: #A9B6C8">› new challenges waiting <span style="color: {{accent}}">✓</span></div>
        <div style="padding: 0 18px; color: #A9B6C8">› weekly hunt is <span style="color: #FFB547">live</span></div>
        <div style="padding: 0 18px; color: #A9B6C8">› your streak is on the line</div>
      </div>
    </div>
    <span style="font-size: 13px; color: #7D8CA1">© 2026 BugHunter Arena</span>
  </div>

  <!-- Right: form -->
  <main style="flex: 1 1 480px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 56px 24px">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; letter-spacing: -0.02em; color: #FFFFFF">Log in</h1>
        <p style="margin: 0; font-size: 15px; color: #93A2B6">New here? <a href="Signup.dc.html" style="color: {{accent}}; font-weight: 600">Create an account</a></p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 10px; border: 1px solid #2E3B4E; background: #10161F; color: #E6EDF6; font: 600 15px Inter, sans-serif; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.4 6.4-1.5 6.4-7a5.4 5.4 0 0 0-1.5-3.8 5 5 0 0 0-.1-3.8s-1.2-.4-3.9 1.5a13.4 13.4 0 0 0-7 0C6.3 1.5 5.1 1.9 5.1 1.9a5 5 0 0 0-.1 3.8A5.4 5.4 0 0 0 3.5 9.5c0 5.4 3.3 6.6 6.4 7a3.4 3.4 0 0 0-.9 2.6V22"></path></svg>
          GitHub
        </button>
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 10px; border: 1px solid #2E3B4E; background: #10161F; color: #E6EDF6; font: 600 15px Inter, sans-serif; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M21 12h-9"></path></svg>
          Google
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7D8CA1">
        <span style="flex: 1; height: 1px; background: #1F2937"></span>or with email<span style="flex: 1; height: 1px; background: #1F2937"></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="login-email" style="font-size: 14px; font-weight: 500; color: #C9D4E3">Email or username</label>
        <input id="login-email" type="text" placeholder="you@example.com" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #2E3B4E; background: #0F141C; color: #FFFFFF; font: 400 15px Inter, sans-serif; outline-color: {{accent}}">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <label for="login-pass" style="font-size: 14px; font-weight: 500; color: #C9D4E3">Password</label>
          <a href="#forgot" style="font-size: 14px; color: #93A2B6">Forgot password?</a>
        </div>
        <input id="login-pass" type="password" placeholder="••••••••••" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #2E3B4E; background: #0F141C; color: #FFFFFF; font: 400 15px Inter, sans-serif; outline-color: {{accent}}">
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #A9B6C8; min-height: 44px">
        <input type="checkbox" style="width: 18px; height: 18px; accent-color: {{accent}}">
        Keep me logged in
      </label>
      <a href="Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 10px; background: {{accent}}; color: #06110A; font-weight: 600; font-size: 16px">Log in</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5EEA8C","options":["#5EEA8C","#38BDF8","#FFB547","#C084FC"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5EEA8C' };
  }
}
</script>
</body>
</html>
